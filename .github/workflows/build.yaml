name: Build binaries

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build
        run: |
          mkdir -p releases/
          echo "LEGIT-BUILD-CONTENT" > releases/livepeer-task-runner-linux-amd64.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: releases/
